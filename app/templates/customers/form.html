{% extends 'base/layout.html' %}
{% block title %}{{ _('Customer') }} — Maure S2C{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">
        <i class="bi bi-people me-2"></i>
        {% if customer and customer.id %}{{ _('Edit Customer') }}{% else %}{{ _('Add Customer') }}{% endif %}
    </h4>
    <a href="{{ url_for('web_customers.list_customers') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>{{ _('Back to Customers') }}
    </a>
</div>
<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">{{ _('Type') }} <span class="text-danger">*</span></label>
                    <select name="type" class="form-select">
                        <option value="prive" {% if (customer.type if customer and customer.id else customer and customer.get('type')) == 'prive' %}selected{% endif %}>{{ _('Private') }}</option>
                        <option value="company" {% if (customer.type if customer and customer.id else customer and customer.get('type')) == 'company' %}selected{% endif %}>{{ _('Company') }}</option>
                    </select>
                </div>
                <div class="col-md-9">
                    <label class="form-label">{{ _('Name') }} <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" required value="{{ (customer.name if customer and customer.id else customer and customer.get('name')) or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ _('Contact') }}</label>
                    <input type="text" name="contact" class="form-control" value="{{ (customer.contact if customer and customer.id else customer and customer.get('contact')) or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ _('Email') }}</label>
                    <input type="email" name="email" class="form-control" value="{{ (customer.email if customer and customer.id else customer and customer.get('email')) or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ _('Phone') }}</label>
                    <input type="text" name="phone" class="form-control" value="{{ (customer.phone if customer and customer.id else customer and customer.get('phone')) or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ _('Address') }}</label>
                    <input type="text" name="address" class="form-control" value="{{ (customer.address if customer and customer.id else customer and customer.get('address')) or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ _('City') }}</label>
                    <input type="text" name="city" class="form-control" value="{{ (customer.city if customer and customer.id else customer and customer.get('city')) or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">{{ _('Payment Terms') }}</label>
                    <input type="text" name="paiement_terms" class="form-control" placeholder="{{ _('e.g. Net 30') }}" value="{{ (customer.paiement_terms if customer and customer.id else customer and customer.get('paiement_terms')) or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">ICE</label>
                    <input type="text" name="ICE" class="form-control" value="{{ (customer.ICE if customer and customer.id else customer and customer.get('ICE')) or '' }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">RC</label>
                    <input type="text" name="RC" class="form-control" value="{{ (customer.RC if customer and customer.id else customer and customer.get('RC')) or '' }}">
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    {% if customer and customer.id %}{{ _('Save Changes') }}{% else %}{{ _('Create Customer') }}{% endif %}
                </button>
                <a href="{{ url_for('web_customers.list_customers') }}" class="btn btn-outline-secondary ms-2">{{ _('Cancel') }}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
