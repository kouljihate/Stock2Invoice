{% extends 'base/layout.html' %}
{% block title %}{{ _('New Supplier Invoice') }} — Maure S2C{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-plus-circle me-2"></i>{{ _('New Supplier Invoice') }}</h4>
<form method="POST" action="" class="card shadow-sm">
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">{{ _('Supplier') }} *</label>
                <select name="supplier_id" class="form-select" id="supplier-select" required>
                    <option value="">{{ _('-- Select Supplier --') }}</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}" data-name="{{ s.name }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
                <input type="hidden" name="supplier_name" id="supplier-name" value="">
            </div>
            <div class="col-md-4">
                <label class="form-label">{{ _('PO Reference') }}</label>
                <input type="text" name="po_number" class="form-control" placeholder="{{ _('PO number') }}">
                <input type="hidden" name="po_id" value="">
            </div>
            <div class="col-md-4">
                <label class="form-label">{{ _('Due Date') }}</label>
                <input type="date" name="due_date" class="form-control">
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-3">
                <label class="form-label">{{ _('Discount') }} (%)</label>
                <input type="number" step="0.01" name="discount_percent" class="form-control" value="0" min="0" max="100">
            </div>
            <div class="col-md-3">
                <label class="form-label">{{ _('Tax') }} (%)</label>
                <input type="number" step="0.01" name="tax_percent" class="form-control" value="0" min="0" max="100">
            </div>
        </div>
        <h5 class="mt-4 mb-3">{{ _('Line Items') }}</h5>
        <div id="line-items">
            <div class="row g-2 mb-2 line-item">
                <div class="col-md-2">
                    <input type="text" name="sku" class="form-control" placeholder="{{ _('SKU') }}" required>
                </div>
                <div class="col-md-4">
                    <input type="text" name="name" class="form-control" placeholder="{{ _('Item name') }}">
                </div>
                <div class="col-md-2">
                    <input type="number" name="quantity" class="form-control" placeholder="{{ _('Qty') }}" min="1" required>
                </div>
                <div class="col-md-2">
                    <input type="number" step="0.01" name="unit_price" class="form-control" placeholder="{{ _('Price') }}" min="0" required>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-danger remove-item"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-success mb-3" id="add-item">
            <i class="bi bi-plus-lg me-1"></i>{{ _('Add Item') }}
        </button>
        <div class="mb-3">
            <label class="form-label">{{ _('Notes') }}</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>{{ _('Create Invoice') }}</button>
            <a href="{{ url_for('web_supplier_invoices.list_invoices') }}" class="btn btn-outline-secondary">{{ _('Cancel') }}</a>
        </div>
    </div>
</form>
{% endblock %}
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('supplier-select').addEventListener('change', function () {
        var opt = this.options[this.selectedIndex];
        document.getElementById('supplier-name').value = opt.dataset.name || '';
    });
    document.getElementById('add-item').addEventListener('click', function () {
        var template = document.querySelector('.line-item');
        var clone = template.cloneNode(true);
        clone.querySelectorAll('input').forEach(function (inp) { inp.value = ''; });
        document.getElementById('line-items').appendChild(clone);
    });
    document.getElementById('line-items').addEventListener('click', function (e) {
        if (e.target.closest('.remove-item')) {
            var items = document.querySelectorAll('.line-item');
            if (items.length > 1) e.target.closest('.line-item').remove();
        }
    });
});
</script>
{% endblock %}
