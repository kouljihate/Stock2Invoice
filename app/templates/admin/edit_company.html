{% extends 'base/layout.html' %}
{% block title %}Edit {{ company.name }} — Admin{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0"><i class="bi bi-pencil me-2"></i>Edit Company</h4>
            <a href="{{ url_for('admin.company_detail', company_id=company.id) }}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Back
            </a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="company_name" class="form-control" value="{{ company.name }}" required>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check me-1"></i>Save Changes</button>
                    <a href="{{ url_for('admin.company_detail', company_id=company.id) }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
