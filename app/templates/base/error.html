{% extends 'base/layout.html' %}
{% block title %}Error {{ code }} — StockInvoice{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-muted">{{ code }}</h1>
    <p class="lead">{{ message }}</p>
    <a href="{% if mode == 'mobile' %}{{ url_for('mobile_auth.login') }}{% else %}{{ url_for('web_auth.login') }}{% endif %}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-1"></i>Go Home
    </a>
</div>
{% endblock %}
