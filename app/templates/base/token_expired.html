<!DOCTYPE html>
<html lang="en" data-lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired — Maure STC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="auth-card text-center">
        <div class="brand-icon mx-auto">
            <i class="bi bi-clock-history"></i>
        </div>
        <h4 class="mt-3">{{ _('Session Expired') }}</h4>
        <p class="text-muted mb-4">{{ _('Your session has timed out. Please log in again to continue.') }}</p>
        <a href="{{ url_for('web_auth.login') }}" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>{{ _('Return to Login') }}
        </a>
    </div>
    <div class="auth-footer">
        &copy; {{ build_date[:4] }} Maure STC &middot; v{{ version }}
    </div>
</body>
</html>
