<!DOCTYPE html>
<html lang="en" data-lang="{{ current_lang }}" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Expired — Maure S2C</title>
    <link href="{{ url_for('static', filename='css/themes/cyborg.css') }}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/neon.css') }}">
</head>
<body class="auth-body d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="grid-overlay"></div>
    <div class="scanlines"></div>
    <div class="auth-card text-center">
        <div class="brand-icon mx-auto">
            <i class="bi bi-clock-history"></i>
        </div>
        <h4 class="mt-3">{{ dual('Session Expired') }}</h4>
        <p class="text-muted mb-4">{{ dual('Your session has timed out. Please log in again to continue.') }}</p>
        <a href="{{ url_for('web_auth.login') }}" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right me-1"></i>{{ dual('Return to Login') }}
        </a>
    </div>
    <div class="auth-footer">
        &copy; {{ build_date[:4] }} Maure S2C &middot; <span class="version">v{{ version }}</span>
    </div>
</body>
</html>
