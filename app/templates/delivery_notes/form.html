{% extends 'base/layout.html' %}
{% block title %}{{ dual('New Delivery Note') }} — Maure S2C{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-plus-circle me-2"></i>{{ dual('New Delivery Note') }}</h4>
<form method="POST" action="" class="card shadow-sm">
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">{{ dual('Order') }} *</label>
                <select name="order_id" class="form-select" id="order-select" required>
                    <option value="">{{ _('-- Select Order --') }}</option>
                    {% for o in orders %}
                    <option value="{{ o.id }}" data-number="{{ o.order_number }}" data-customer="{{ o.customer_name }}">{{ o.order_number }} — {{ o.customer_name }}</option>
                    {% endfor %}
                </select>
                <input type="hidden" name="order_number" id="order-number" value="">
                <input type="hidden" name="customer_name" id="customer-name" value="">
            </div>
        </div>
        <h5 class="mt-4 mb-3">{{ dual('Delivered Items') }}</h5>
        <div id="line-items">
            <div class="row g-2 mb-2 line-item">
                <div class="col-md-3">
                    <input type="text" name="sku" class="form-control" placeholder="{{ _('SKU') }}" required>
                </div>
                <div class="col-md-5">
                    <input type="text" name="name" class="form-control" placeholder="{{ _('Item name') }}">
                </div>
                <div class="col-md-2">
                    <input type="number" name="quantity" class="form-control" placeholder="{{ _('Qty') }}" min="1" required>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-danger remove-item"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-success mb-3" id="add-item">
            <i class="bi bi-plus-lg me-1"></i>{{ dual('Add Item') }}
        </button>
        <div class="mb-3">
            <label class="form-label">{{ dual('Notes') }}</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>{{ dual('Create Delivery Note') }}</button>
            <a href="{{ url_for('web_delivery_notes.list_delivery_notes') }}" class="btn btn-outline-secondary">{{ dual('Cancel') }}</a>
        </div>
    </div>
</form>
{% endblock %}
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('order-select').addEventListener('change', function () {
        var opt = this.options[this.selectedIndex];
        document.getElementById('order-number').value = opt.dataset.number || '';
        document.getElementById('customer-name').value = opt.dataset.customer || '';
    });
    document.getElementById('add-item').addEventListener('click', function () {
        var template = document.querySelector('.line-item');
        var clone = template.cloneNode(true);
        clone.querySelectorAll('input').forEach(function (inp) { inp.value = ''; });
        document.getElementById('line-items').appendChild(clone);
    });
    document.getElementById('line-items').addEventListener('click', function (e) {
        if (e.target.closest('.remove-item')) {
            var items = document.querySelectorAll('.line-item');
            if (items.length > 1) e.target.closest('.line-item').remove();
        }
    });
});
</script>
{% endblock %}
