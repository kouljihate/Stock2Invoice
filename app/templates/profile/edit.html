{% extends 'base/layout.html' %}
{% block title %}{{ dual('Edit Profile') }} — Maure S2C{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h4 mb-0"><i class="bi bi-person-gear me-1"></i>{{ dual('Edit Profile') }}</h1>
                <a href="{{ url_for('web_dashboard.index') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i>{{ dual('Back') }}
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="POST" action="{{ url_for('web_profile.edit') }}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">{{ dual('Full name') }} *</label>
                                <input type="text" name="name" class="form-control" required
                                       value="{{ values.get('name', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ dual('Phone') }}</label>
                                <input type="tel" name="phone" class="form-control"
                                       placeholder="+212 6XX XX XX XX"
                                       value="{{ values.get('phone', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ dual('Email') }}</label>
                                <input type="email" class="form-control" value="{{ user.email }}" disabled>
                                <div class="form-text">{{ dual('Your email is your login and cannot be changed here.') }}</div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">{{ dual('Role') }}</label>
                                <input type="text" class="form-control" value="{{ user.role_names|join(', ') }}" disabled>
                            </div>
                            {% if current_company %}
                            <div class="col-12">
                                <label class="form-label">{{ dual('Company') }}</label>
                                <input type="text" class="form-control" value="{{ current_company.name }}" disabled>
                            </div>
                            {% endif %}
                        </div>
                        <div class="d-flex justify-content-end mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check2-circle me-1"></i>{{ dual('Save changes') }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
