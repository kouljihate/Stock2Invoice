{% extends 'base/layout.html' %}
{% block title %}Register — StockInvoice{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">
                    <i class="bi bi-box-seam text-primary me-2"></i>StockInvoice
                </h3>
                <p class="text-center text-muted mb-4">Create a new account</p>

                <form method="POST" action="">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Min 8 chars, letters + numbers" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-person-plus me-1"></i>Register
                    </button>
                    <p class="text-center mb-0">
                        Already have an account?
                        <a href="{% if mode == 'mobile' %}{{ url_for('mobile_auth.login') }}{% else %}{{ url_for('web_auth.login') }}{% endif %}">Sign In</a>
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
