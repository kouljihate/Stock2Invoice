<div class="mb-3">
    <label class="form-label">Product Name *</label>
    <input type="text" name="name" class="form-control" value="{{ product.get('name', '') if product else '' }}" required>
</div>
<div class="mb-3">
    <label class="form-label">SKU *</label>
    <input type="text" name="sku" class="form-control" value="{{ product.get('sku', '') if product else '' }}" {% if product and product.id %}readonly{% endif %} required>
</div>
<div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="2">{{ product.get('description', '') if product else '' }}</textarea>
</div>
<div class="row mb-3">
    <div class="col-md-4">
        <label class="form-label">Quantity *</label>
        <input type="number" name="quantity" class="form-control" value="{{ product.get('quantity', 0) if product else 0 }}" min="0" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Unit Price *</label>
        <input type="number" step="0.01" name="unit_price" class="form-control" value="{{ product.get('unit_price', 0) if product else 0 }}" min="0" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ product.get('category', '') if product else '' }}">
    </div>
</div>
<div class="row mb-3">
    <div class="col-md-6">
        <label class="form-label">Tax Rate (%)</label>
        <input type="number" step="0.01" name="tax_rate" class="form-control" value="{{ product.get('tax_rate', 0) if product else 0 }}" min="0" max="100">
    </div>
    <div class="col-md-6">
        <label class="form-label">Low Stock Threshold</label>
        <input type="number" name="low_stock_threshold" class="form-control" value="{{ product.get('low_stock_threshold', 5) if product else 5 }}" min="0">
    </div>
</div>
