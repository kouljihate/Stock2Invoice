<div class="mb-3">
    <label class="form-label">Product Name *</label>
    <input type="text" name="name" class="form-control" value="{{ product.get('name', '') if product else '' }}" required>
</div>
<div class="mb-3">
    <label class="form-label">SKU *</label>
    <input type="text" name="sku" class="form-control" value="{{ product.get('sku', '') if product else '' }}" {% if product and product.id %}readonly{% endif %} required>
</div>
<div class="mb-3">
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="2">{{ product.get('description', '') if product else '' }}</textarea>
</div>
<div class="row mb-3">
    <div class="col-md-4">
        <label class="form-label">Quantity *</label>
        <input type="number" name="quantity" class="form-control" value="{{ product.get('quantity', 0) if product else 0 }}" min="0" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Unit Price *</label>
        <input type="number" step="0.01" name="price" class="form-control" value="{{ product.get('unit_price', 0) if product else 0 }}" min="0" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ product.get('category', '') if product else '' }}">
    </div>
</div>
<div class="row mb-3">
    <div class="col-md-6">
        <label class="form-label">Tax Rate (%)</label>
        <input type="number" step="0.01" name="status" class="form-control" value=""active">
    </div>
    <div class="col-md-6">
        <label class="form-label">Low Stock Threshold</label>
        <input type="number" name="quantity_min" class="form-control" value="{{ product.get('quantity_min', 5) if product else 5 }}" min="0">
    </div>
</div>
<div class="mb-3">
    <label class="form-label">Product Photos</label>
    <input type="file" name="photos" class="form-control" accept="image/*" multiple>
    {% if product and product.photos %}
        <div class="mt-2">
            {% for photo in product.photos %}
                <img src="{{ photo }}" alt="Product photo" class="img-thumbnail" style="max-width: 100px; max-height: 100px;">
            {% endfor %}
        </div>
    {% endif %}
</div>
