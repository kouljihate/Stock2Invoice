{% extends 'base/layout.html' %}
{% block title %}{{ dual('New Payment') }} — Maure S2C{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-plus-circle me-2"></i>{{ dual('New Payment') }}</h4>
<form method="POST" action="" class="card shadow-sm">
    <div class="card-body">
        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">{{ dual('Supplier') }} *</label>
                <select name="supplier_id" class="form-select" id="supplier-select" required>
                    <option value="">{{ _('-- Select Supplier --') }}</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}" data-name="{{ s.name }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
                <input type="hidden" name="supplier_name" id="supplier-name" value="">
            </div>
            <div class="col-md-4">
                <label class="form-label">{{ dual('Invoice Reference') }}</label>
                <input type="text" name="invoice_number" class="form-control" placeholder="{{ _('Invoice number') }}">
                <input type="hidden" name="invoice_id" value="">
            </div>
            <div class="col-md-4">
                <label class="form-label">{{ dual('Amount') }} *</label>
                <input type="number" step="0.01" name="amount" class="form-control" value="0" min="0" required>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-md-4">
                <label class="form-label">{{ dual('Payment Date') }}</label>
                <input type="date" name="payment_date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">{{ dual('Payment Method') }}</label>
                <select name="payment_method" class="form-select">
                    <option value="">{{ _('-- Select --') }}</option>
                    <option value="bank_transfer">{{ _('Bank Transfer') }}</option>
                    <option value="check">{{ _('Check') }}</option>
                    <option value="cash">{{ _('Cash') }}</option>
                    <option value="credit_card">{{ _('Credit Card') }}</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">{{ dual('Reference') }}</label>
                <input type="text" name="reference" class="form-control" placeholder="{{ _('Check # or ref') }}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">{{ dual('Notes') }}</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>{{ dual('Create Payment') }}</button>
            <a href="{{ url_for('web_payments.list_payments') }}" class="btn btn-outline-secondary">{{ dual('Cancel') }}</a>
        </div>
    </div>
</form>
{% endblock %}
{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('supplier-select').addEventListener('change', function () {
        var opt = this.options[this.selectedIndex];
        document.getElementById('supplier-name').value = opt.dataset.name || '';
    });
});
</script>
{% endblock %}
