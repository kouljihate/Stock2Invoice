[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "si-common"
version = "1.0.0"
description = "Shared kernel for the StockInvoice microservices (auth, tenancy, CRUD, RabbitMQ)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pymongo>=4.6",
    "pika>=1.3",
    "PyJWT>=2.8",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
include = ["si_common*"]
