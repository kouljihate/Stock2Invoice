# StockInvoice — Flask Jinja BFF + 5 FastAPI domain services + RabbitMQ.
#
#   docker compose up --build
#   open http://localhost:8080        (edge gateway -> BFF)
#   rabbitmq management: http://localhost:15672 (guest/guest)
#
# Domain services are also published on the host (8001-8005) so the BFF can
# be run locally with `python run.py` during development.
#
# Event flow: services write domain events to their Mongo `outbox`; an
# in-process relay publishes them to the `domain.events` topic exchange
# (publisher confirms on). Consumers ack manually, deduplicate on
# `event_id`, and retry through a 5s -> 30s -> 300s ladder before the DLQ.

name: stockinvoice

x-service-env: &service-env
  MONGO_URI: mongodb://mongo:27017/stockinvoice
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-this-in-production-0123456789}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-dev-secret-change-this-in-production-0123456789}
  JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-86400}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-si-internal-dev-key}
  IDENTITY_URL: http://identity:8001
  INVENTORY_URL: http://inventory:8002
  SALES_URL: http://sales:8003
  PROCUREMENT_URL: http://procurement:8004
  WORKERS_URL: http://workers:8005

# Every domain service exposes /health -> {"status": "ok"|"degraded"} once its
# Mongo indexes, outbox relay and RabbitMQ topology are up. The BFF only
# starts after all five are "ok", so the first browser request never hits a
# half-booted backend.
x-service-healthcheck: &service-healthcheck
  test: ["CMD-SHELL", "python -c \"import json,os,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ['SERVICE_PORT'], timeout=5)); raise SystemExit(0 if d.get('status')=='ok' else 1)\""]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 90s

# Unbounded container logs fill the host disk; rotate everywhere.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-service-base: &service-base
  restart: unless-stopped
  logging: *default-logging
  environment: *service-env
  depends_on:
    mongo:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  mongo:
    image: mongo:7
    logging: *default-logging
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"   # host access for the data-migration script
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: stockinvoice-rabbit
    logging: *default-logging
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  identity:
    <<: *service-base
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: identity }
    environment:
      <<: *service-env
      SERVICE_PORT: "8001"
    ports:
      - "8001:8001"
    healthcheck: *service-healthcheck

  inventory:
    <<: *service-base
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: inventory }
    environment:
      <<: *service-env
      SERVICE_PORT: "8002"
    ports:
      - "8002:8002"
    healthcheck: *service-healthcheck

  sales:
    <<: *service-base
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: sales }
    environment:
      <<: *service-env
      SERVICE_PORT: "8003"
    ports:
      - "8003:8003"
    healthcheck: *service-healthcheck

  procurement:
    <<: *service-base
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args: { SERVICE: procurement }
    environment:
      <<: *service-env
      SERVICE_PORT: "8004"
    ports:
      - "8004:8004"
    healthcheck: *service-healthcheck

  workers:
    <<: *service-base
    build:
      context: .
      dockerfile: deploy/Dockerfile.workers
    environment:
      <<: *service-env
      SERVICE_PORT: "8005"
    ports:
      - "8005:8005"
    # Company logos uploaded through the BFF must be visible to the PDF
    # renderer, and must survive container redeploys: share the folder.
    volumes:
      - static_uploads:/srv/app/static/uploads
    healthcheck: *service-healthcheck

  bff:
    restart: unless-stopped
    logging: *default-logging
    build:
      context: .
      dockerfile: deploy/Dockerfile.bff
    environment:
      FLASK_ENV: production
      HOST: 0.0.0.0
      PORT: "5002"
      MONGO_URI: mongodb://mongo:27017/stockinvoice
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2f
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-this-in-production-0123456789}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-dev-secret-change-this-in-production-0123456789}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-86400}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-0}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      AUTH_RATE_WINDOW: ${AUTH_RATE_WINDOW:-300}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-si-internal-dev-key}
      IDENTITY_URL: http://identity:8001
      INVENTORY_URL: http://inventory:8002
      SALES_URL: http://sales:8003
      PROCUREMENT_URL: http://procurement:8004
      WORKERS_URL: http://workers:8005
    volumes:
      # Same uploads folder the workers-service reads when rendering PDFs.
      - static_uploads:/srv/app/static/uploads
    ports:
      - "5002:5002"
    depends_on:
      mongo:
        condition: service_healthy
      identity:
        condition: service_healthy
      inventory:
        condition: service_healthy
      sales:
        condition: service_healthy
      procurement:
        condition: service_healthy
      workers:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5002/api/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway:
    image: nginx:1.27-alpine
    logging: *default-logging
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - bff

volumes:
  mongo_data:
  rabbit_data:
  static_uploads:   # company logos: written by the BFF, read by workers-service
